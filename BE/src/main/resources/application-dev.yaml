websocket:
  port: ${SOCKET_PORT}

spring:
  config:
    activate:
      on-profile: dev
  # [추가] Kafka 설정
  kafka:
    properties:
      reconnect.backoff.ms: 1000      # 배포 환경: 1->2->4->8->10
      reconnect.backoff.max.ms: 10000 # 최대 10초까지 대기함
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS} # 환경변수 없으면 기본값 사용
    consumer:
      group-id: virtudy-group
      auto-offset-reset: earliest
      max-poll-records: 500 # 한 번에 가져올 최대 개수
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.json.trusted.packages: "*" # 모든 패키지의 DTO 허용
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: "com.ssafy.virtudy.study.dto.StudyLogRequest"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    listener:
      type: batch # 배치 모드 활성화

  data:
    redis:
      host: host.docker.internal
      port: ${REDIS_PORT}
      password: ${DEV_REDIS_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DEV_DB_HOST}:${DEV_DB_PORT}/${DEV_DB_NAME}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DEV_DB_USER}
    password: ${DEV_DB_PASSWORD}

server:
  port: ${SERVER_PORT}

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret-id: ${KAKAO_CLIENT_SECRET_ID}
  redirect-uri: "http://i14a703.p.ssafy.io/auth/kakao/callback"
  token-uri: "https://kauth.kakao.com/oauth/token"
  user-info-uri: "https://kapi.kakao.com/v2/user/me"

jwt:
  secret_key: ${JWT_SECRET_KEY}
  access-expmin: ${JWT_ACCESS_EXPMIN}
  refresh-expmin: ${JWT_REFRESH_EXPMIN}

livekit:
  url: ${LIVEKIT_URL}
  api:
    key: ${LIVEKIT_API_KEY}
    secret: ${LIVEKIT_API_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

  metrics:
    tags:
      application: 'virtudy-server'

gms:
  key: ${GMS_KEY}
